services:
  db:
    image: postgres:16-alpine
    container_name: agrosierra-db-pari
    environment:
      POSTGRES_DB: agrosierra
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: agro2026
    ports:
      - "5432:5432"
    volumes:
      - agro-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agrosierra"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: agrosierra-api-pari
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/agrosierra
      DB_USER: agro
      DB_PASSWORD: agro2026
    ports:
      - "8080:8080"

volumes:
  agro-datos:
